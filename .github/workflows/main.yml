name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Vet
        run: go vet ./...

      - name: Go tests
        run: go test -race ./...

      - name: Crypto tests
        run: node --test web/test/*.test.mjs

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    env:
      GOOS: linux
      GOARCH: ${{ matrix.goarch }}
      # modernc.org/sqlite is pure Go, so the binary is fully static.
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        # web/ is embedded into the binary, so it doesn't need to ship separately.
        run: go build -trimpath -ldflags='-s -w' -o dist/emerchat ./cmd/emerchat

      - name: Package
        run: |
          cp deploy/emerchat.service deploy/nginx.conf deploy/install.sh README.md dist/
          chmod +x dist/emerchat dist/install.sh
          tar -czf emerchat-linux-${GOARCH}.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: emerchat-linux-${{ matrix.goarch }}
          path: emerchat-linux-${{ matrix.goarch }}.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Checksums
        run: sha256sum emerchat-linux-*.tar.gz > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY" --generate-notes
          emerchat-linux-*.tar.gz SHA256SUMS
